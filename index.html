<style id="basecss">
html, body { margin: 0; padding: 0; background: #12161c; color: #e8edf2;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
button, input, select { font-family: inherit; font-size: 1em; }

#top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #12161c;

#bar { display: -ms-flexbox; display: flex; padding: 8px; }
#q { -ms-flex: 1; flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid #3a4452;

#q:focus { border-color: #f2b134; }
#go { width: 48px; height: 40px; border: 0; background: #f2b134; color: #12161c;

#gear { width: 40px; height: 40px; margin-left: 6px; border: 1px solid #3a4452; background: transparent;
  color: #e8edf2; border-radius: 4px; }
#tabs { display: -ms-flexbox; display: flex; }
.tab { -ms-flex: 1; flex: 1; text-align: center; padding: 10px 0; background: none; border: 0;
  color: #8e9aab; border-bottom: 3px solid transparent; }
.tab.on { color: #f2b134; border-bottom-color: #f2b134; font-weight: 600; }

#main { padding-top: 106px; padding-bottom: 24px; }
.item { display: block; width: 100%; padding: 0 0 14px 0; text-align: left; color: inherit; cursor: pointer; }
.thumb { position: relative; width: 100%; padding-top: 56.25%; background: #1c222b; overflow: hidden; }
.thumb img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
.dur { position: absolute; right: 6px; bottom: 6px; padding: 1px 5px; background: rgba(0,0,0,.82);
  font-size: 12px; font-weight: 600; border-radius: 2px; }
.meta { padding: 8px 12px 0 12px; }
.ttl { font-size: 15px; line-height: 20px; max-height: 40px; overflow: hidden; font-weight: 600; }
.sub { margin-top: 3px; font-size: 12.5px; color: #8e9aab; }
.chan { display: inline-block; padding: 3px 0; color: #b4c0d0; text-decoration: underline;
  text-decoration-color: #4a5566; cursor: pointer; }

.msg { margin: 24px 16px; padding: 14px; background: #1c222b; border-left: 3px solid #f2b134;
  line-height: 1.45; }
.msg.err { border-left-color: #e5534b; }
.more { display: block; width: calc(100% - 24px); margin: 4px 12px; height: 44px; border: 1px solid #3a4452;
  background: transparent; color: #e8edf2; border-radius: 4px; }
.spin { text-align: center; color: #8e9aab; padding: 24px; }

/* ----- canal ----- */
#chan { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 15;
  background: #12161c; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
#cbar { height: 44px; display: -ms-flexbox; display: flex; -ms-flex-align: center; align-items: center;
  border-bottom: 1px solid #2a323d; margin-bottom: 12px; }
#cback { height: 44px; padding: 0 16px; border: 0; background: none; color: #f2b134; font-weight: 600; }
#chead { display: -ms-flexbox; display: flex; -ms-flex-align: center; align-items: center;
  padding: 4px 12px 16px 12px; }
#chead img { width: 64px; height: 64px; border-radius: 50%; background: #1c222b; margin-right: 14px; }
#chead .cn { font-size: 19px; font-weight: 600; line-height: 24px; }
#chead .cs { margin-top: 2px; font-size: 12.5px; color: #8e9aab; }

/* ----- reproductor ----- */
#player { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
  background: #12161c; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#pbar { height: 44px; display: -ms-flexbox; display: flex; -ms-flex-align: center; align-items: center; }
#back { height: 44px; padding: 0 16px; border: 0; background: none; color: #f2b134; font-weight: 600; }

#vwrap { background: #000; }
#frame { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
#frame iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
#ctl { background: #12161c; padding: 4px 8px 8px 8px; }
#seekrow { display: -ms-flexbox; display: flex; -ms-flex-align: center; align-items: center; height: 36px; }
#seekrow span { width: 46px; font-size: 12px; color: #8e9aab; text-align: center; }
#seek { -ms-flex: 1; flex: 1; min-width: 0; height: 32px; margin: 0; padding: 0; background: transparent; }
#seek::-ms-track { height: 4px; background: transparent; border-color: transparent; color: transparent; }
#seek::-ms-fill-lower { background: #f2b134; }
#seek::-ms-fill-upper { background: #3a4452; }
#seek::-ms-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: #f2b134; }
#seek::-ms-tooltip { display: none; }
#btnrow, #btnrow2 { display: -ms-flexbox; display: flex; }
#btnrow2 { margin-top: 6px; }
.cb { -ms-flex: 1; flex: 1; height: 40px; margin: 0 3px; border: 1px solid #3a4452; background: #1c222b;
  color: #e8edf2; border-radius: 4px; padding: 0 4px; font-weight: 600; }
.cb.sm { height: 36px; font-size: 13px; overflow: hidden; white-space: nowrap; }
.cb.act { border-color: #f2b134; color: #f2b134; }
.cb.wide { -ms-flex: 1.6; flex: 1.6; background: #f2b134; color: #12161c; border-color: #f2b134; }
.cb svg { width: 20px; height: 20px; vertical-align: middle; }

/* pantalla completa: se ocultan por completo los controles propios */
#vwrap.fs { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40;
  display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column; }
#vwrap.fs #frame { -ms-flex: 1; flex: 1; padding-top: 0; min-height: 0; }
#vwrap.fs #ctl { display: none; }

#pinfo { padding: 12px; }
#ptitle { font-size: 17px; font-weight: 600; line-height: 22px; }
#pchan { margin-top: 4px; color: #f2b134; font-weight: 600; text-decoration: none; }
#pstats { margin-top: 2px; font-size: 12.5px; color: #8e9aab; }
#ptabs { display: -ms-flexbox; display: flex; margin-top: 12px; border-bottom: 1px solid #2a323d; }
#pdesc { margin-top: 14px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.45;
  color: #c4ccd6; font-size: 14px; }
#pcomm { display: none; margin-top: 10px; }
#pfall { display: inline-block; margin-top: 12px; color: #8e9aab; font-size: 13px; }

#cmord { display: -ms-flexbox; display: flex; margin-bottom: 6px; }
.ord { height: 32px; padding: 0 14px; margin-right: 8px; border: 1px solid #3a4452; background: transparent;
  color: #8e9aab; border-radius: 16px; font-size: 13px; }
.ord.on { color: #12161c; background: #f2b134; border-color: #f2b134; font-weight: 600; }
.cm { padding: 10px 0; border-bottom: 1px solid #222a35; }
.cm.rp { margin-left: 18px; border-bottom: 0; padding: 8px 0 2px 0; }
.ca { font-size: 13px; font-weight: 600; color: #b4c0d0; }
.ca .cd { font-weight: 400; color: #6f7c8e; margin-left: 6px; font-size: 12px; }
.ct { margin-top: 3px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; font-size: 14px;

.cl { margin-top: 4px; font-size: 12px; color: #8e9aab; }
.rbtn { margin-left: 10px; padding: 4px 0; border: 0; background: none; color: #f2b134; font-size: 12px;
  font-weight: 600; }

#qnow { color: #8e9aab; font-size: 12.5px; margin: 2px 0 8px 0; min-height: 16px; }

#qnote { color: #8e9aab; font-size: 12px; line-height: 1.4; margin-top: 10px; }

    <input id="q" type="search" data-i18n-ph="searchPh" autocomplete="off">
    <button id="go" type="button">&#9658;</button>
    <button id="gear" type="button" data-i18n-title="settings">&#9881;</button>
  </div>
  <div id="tabs">
    <button class="tab on" id="tab-trend" type="button" data-i18n="trend"></button>
    <button class="tab" id="tab-search" type="button" data-i18n="results"></button>
  </div>
</div>

<div id="main"><div id="list"></div></div>

<div id="chan">
  <div id="cbar"><button id="cback" type="button" data-i18n="backBtn"></button></div>
  <div id="chead"></div>
  <div id="clist"></div>
</div>

<div id="player">
  <div id="pbar"><button id="back" type="button" data-i18n="backBtn"></button></div>
  <div id="vwrap">
    <div id="frame"></div>
    <div id="ctl">
      <div id="seekrow">
        <span id="tcur">0:00</span>
        <input type="range" id="seek" min="0" max="100" step="1" value="0">
        <span id="tdur">0:00</span>
      </div>
      <div id="btnrow">
        <button class="cb" type="button" data-seek="-30">&minus;30</button>
        <button class="cb" type="button" data-seek="-10">&minus;10</button>
        <button class="cb wide" type="button" id="pp"></button>
        <button class="cb" type="button" data-seek="10">+10</button>
        <button class="cb" type="button" data-seek="30">+30</button>
        <button class="cb" type="button" id="fsbtn" data-i18n-title="fullscreen">
          <svg viewBox="0 0 20 20" fill="none" stroke="#e8edf2" stroke-width="2">
            <path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg>
        </button>
      </div>
      <div id="btnrow2">
        <button class="cb sm" type="button" id="ccbtn"></button>
        <button class="cb sm" type="button" id="qbtn"></button>
      </div>
    </div>
  </div>
  <div id="pinfo">
    <div id="ptitle"></div>
    <div id="pchan"></div>
    <div id="pstats"></div>
    <div id="ptabs">
      <button class="tab on" id="ptab-desc" type="button" data-i18n="desc"></button>
      <button class="tab" id="ptab-comm" type="button" data-i18n="comments"></button>
    </div>
    <div id="pdesc"></div>
    <div id="pcomm">
      <div id="cmord">
        <button class="ord on" type="button" data-order="relevance" data-i18n="popular"></button>
        <button class="ord" type="button" data-order="time" data-i18n="recent"></button>
      </div>
      <div id="cmlist"></div>
    </div>
    <a id="pfall" target="_blank" rel="noopener" data-i18n="openYT"></a>
  </div>
</div>

<div id="qmenu">
  <div id="qsheet">
    <div id="qtitle"></div>
    <div id="qnow"></div>
    <div id="qopts"></div>
    <div id="qnote"></div>
  </div>
</div>

<div id="cfg">
  <h2 data-i18n="settings"></h2>
  <p data-i18n="cfgIntro"></p>
  <label for="key" data-i18n="apiKey"></label>
  <input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="reg" data-i18n="region"></label>
  <input id="reg" type="text" maxlength="2" autocapitalize="characters" autocomplete="off">
  <label for="lang" data-i18n="language"></label>
  <select id="lang">
    <option value="es">Espa&ntilde;ol</option>
    <option value="en">English</option>
    <option value="pt">Portugu&ecirc;s</option>
    <option value="fr">Fran&ccedil;ais</option>
  </select>
  <label id="lbl-accent"></label>
  <div id="accents" class="sw"></div>
  <label id="lbl-bg"></label>
  <div id="bgs" class="sw"></div>
  <button class="btn" id="save" type="button" data-i18n="save"></button>
  <button class="btn alt" id="close" type="button" data-i18n="close"></button>
</div>

  function esc(s) {

    if (!m) { return ""; }
    var h = (+m[1] || 0) * 24 + (+m[2] || 0), mi = +m[3] || 0, s = +m[4] || 0;

  function call(endpoint, params) {

      if (P.heard || P.tries++ > 30) { stopListening(); return; }
      post({ event: "listening", id: 1, channel: "widget" });
    }, 400);
  }

  function refreshCtl() {
    $("tcur").textContent = fmtClock(P.cur);
    $("tdur").textContent = fmtClock(P.dur);
    var sk = $("seek");
    if (P.dur > 0) { sk.max = Math.floor(P.dur); }
    if (Date.now() - P.lastUser > 1500) { sk.value = Math.floor(P.cur); }
    $("pp").textContent = P.st === 1 ? t("pause") : t("play");
  }

    cmd("seekTo", [s, true]);
    $("seek").value = Math.floor(s);
    $("tcur").textContent = fmtClock(s);
  }
  function seekBy(delta) { seekTo(P.cur + delta); }

  /* ---------- calidad ---------- */
  var QOPTS = [["auto", ""], ["hd1080", "1080p"], ["hd720", "720p"], ["large", "480p"],
               ["medium", "360p"], ["small", "240p"], ["tiny", "144p"]];
  var QNAMES = { hd2160: "2160p", hd1440: "1440p", hd1080: "1080p", hd720: "720p", large: "480p",
                 medium: "360p", small: "240p", tiny: "144p", highres: "4K+" };
  function qLabel(k) { return k === "auto" ? t("auto") : (QNAMES[k] || k); }
  var QDIMS = { hd1080: [1920, 1080], hd720: [1280, 720], large: [854, 480], medium: [640, 360],
                small: [426, 240], tiny: [256, 144] };
  // YouTube elige la resolución según el tamaño del reproductor: lo hacemos "grande" por dentro
  // y lo achicamos con una transformación para que entre en la pantalla.
  function sizeFrame() {
    var f = getIframe();
    if (!f) { return; }
    var d = QDIMS[getQ()], box = $("frame"), st = f.style;
    if (!d) {
      st.width = "100%"; st.height = "100%"; st.left = "0px"; st.top = "0px"; st.transform = "none";
      return;
    }
    var bw = box.clientWidth, bh = box.clientHeight;
    if (!bw || !bh) { return; }
    var k = Math.min(bw / d[0], bh / d[1]);
    st.width = d[0] + "px"; st.height = d[1] + "px";
    st.left = Math.round((bw - d[0] * k) / 2) + "px";
    st.top = Math.round((bh - d[1] * k) / 2) + "px";
    st.transformOrigin = "0 0";
    st.transform = "scale(" + k + ")";
  }

  function updateBtns() {
    var cc = ccOn(), q = getQ();
    $("ccbtn").textContent = t("subs") + ": " + (cc ? t("on") : t("off"));
    $("ccbtn").className = "cb sm" + (cc ? " act" : "");
    var ql = qLabel(q);
    if (q === "auto" && P.qNow && P.qNow !== "unknown" && QNAMES[P.qNow]) { ql += " (" + QNAMES[P.qNow] + ")"; }
    $("qbtn").textContent = t("quality") + ": " + ql;
    $("qbtn").className = "cb sm" + (q !== "auto" ? " act" : "");
  }
  function applyQuality() {
    var q = getQ();
    if (q === "auto") { return; }
    cmd("setPlaybackQuality", [q]);
    cmd("setPlaybackQualityRange", [q, q]);
  }
  function setQuality(q) {
    store.set("yt_q", q);
    if (q === "auto") {
      cmd("setPlaybackQuality", ["default"]);
      cmd("setPlaybackQualityRange", ["tiny", "highres"]);
    } else {
      applyQuality();
      setTimeout(applyQuality, 1500);
    }
    sizeFrame();
    updateBtns();
    closeQ();
  }
  function openQ() {
    var saved = getQ(), h = "";
    for (var i = 0; i < QOPTS.length; i++) {
      var k = QOPTS[i][0];
      var dis = P.avail && k !== "auto" && P.avail.indexOf(k) < 0;
      h += '<button class="qo' + (saved === k ? " on" : "") + (dis ? " dis" : "") +
           '" type="button" data-q="' + k + '">' + esc(k === "auto" ? t("auto") : QOPTS[i][1]) + "</button>";
    }
    $("qopts").innerHTML = h;
    $("qtitle").textContent = t("quality");
    $("qnow").textContent = (P.qNow && P.qNow !== "unknown") ? t("qNow") + ": " + qLabel(P.qNow) : "";
    $("qnote").textContent = t("qNote");
    $("qmenu").style.display = "block";
  }
  function closeQ() { $("qmenu").style.display = "none"; }

  window.addEventListener("message", function (e) {
    if (String(e.origin).indexOf("youtube.com") < 0) { return; }
    var f = getIframe();
    if (!f || e.source !== f.contentWindow) { return; }
    P.heard = true;
    var d = e.data;
    if (typeof d === "string") { try { d = JSON.parse(d); } catch (err) { return; } }
    if (!d) { return; }
    if ((d.event === "infoDelivery" || d.event === "initialDelivery") && d.info) {
      var i = d.info, changed = false;
      if (typeof i.currentTime === "number") { P.cur = i.currentTime; }
      if (typeof i.duration === "number" && i.duration > 0) { P.dur = i.duration; }
      if (typeof i.playerState === "number") { P.st = i.playerState; }
      if (typeof i.playbackQuality === "string" && i.playbackQuality !== P.qNow) { P.qNow = i.playbackQuality; changed = true; }
      if (i.availableQualityLevels && i.availableQualityLevels.length) { P.avail = i.availableQualityLevels; }
      refreshCtl();
      if (changed) { updateBtns(); }
      if (P.st === 1 && !P.qApplied) {
        P.qApplied = true;
        applyQuality();
        setTimeout(applyQuality, 1500);
      }
      if (P.st === 1 && !P.ccApplied) {
        P.ccApplied = true;
        enforceCC();
      }
    } else if (d.event === "onStateChange" && typeof d.info === "number") {
      P.st = d.info;
      refreshCtl();
    }
  }, false);

  /* ---------- pantalla completa ---------- */
  function nativeFsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement ||
           document.msFullscreenElement || document.mozFullScreenElement || null;
  }
  function nativeFsRequest(el) {
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen ||
             el.mozRequestFullScreen;
    if (!fn) { return; }
    try {
      var p = fn.call(el);
      if (p && p.catch) { p.catch(function () {}); }
    } catch (e) {}
    try {
      var o = window.screen && screen.orientation;
      if (o && o.lock) { var pr = o.lock("landscape"); if (pr && pr.catch) { pr.catch(function () {}); } }
    } catch (e2) {}
  }
  function nativeFsExit() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen ||
             document.mozCancelFullScreen;
    if (fn && nativeFsElement()) {
      try { var p = fn.call(document); if (p && p.catch) { p.catch(function () {}); } } catch (e) {}
    }
    try { if (window.screen && screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); } }
    catch (e2) {}
  }
  function setFs(on) {
    $("vwrap").className = on ? "fs" : "";
    if (on) { closeQ(); } else { nativeFsExit(); }
    sizeFrame();
  }
  function toggleFs() {
    if (/,fs$/.test(location.hash)) { history.back(); return; }
    nativeFsRequest($("vwrap"));
    location.hash = "v=" + currentId + ",fs";
  }
  function onNativeFsChange() {
    if (!nativeFsElement() && /,fs$/.test(location.hash)) { history.back(); }
  }
  ["fullscreenchange", "webkitfullscreenchange", "MSFullscreenChange", "mozfullscreenchange"]
    .forEach(function (n) { document.addEventListener(n, onNativeFsChange, false); });

  /* ---------- reproductor: abrir / cerrar / subtítulos ---------- */
  function embedUrl(id, start) {
    var origin = encodeURIComponent(location.protocol + "//" + location.host);
    return "https://www.youtube.com/embed/" + encodeURIComponent(id) +
      "?autoplay=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1" +
      "&hl=" + lang + (ccOn() ? "&cc_load_policy=1&cc_lang_pref=" + lang : "&cc_load_policy=0") +
      (start ? "&start=" + start : "") + "&origin=" + origin;
  }
  // El reproductor recuerda por su cuenta si el usuario activó subtítulos y esa preferencia pisa
  // al parámetro de la URL. Por eso, además de la URL, se le ordena el estado por mensajes.
  function applyCC() {
    if (ccOn()) {
      cmd("loadModule", ["captions"]);
      cmd("setOption", ["captions", "track", { languageCode: lang }]);
    } else {
      cmd("setOption", ["captions", "track", {}]);
      cmd("unloadModule", ["captions"]);
      cmd("unloadModule", ["cc"]);
    }
  }
  // Se repite unos segundos porque el módulo de subtítulos puede cargarse un poco después de que arranque el video.
  function enforceCC() {
    var gen = ++P.ccGen, id = currentId, want = ccOn();
    applyCC();
    [700, 1800, 3500].forEach(function (ms) {
      setTimeout(function () {
        if (gen === P.ccGen && id === currentId && want === ccOn()) { applyCC(); }
      }, ms);
    });
  }
  function toggleCC() {
    var turningOn = !ccOn();
    store.set("yt_cc", turningOn ? "1" : "0");
    updateBtns();
    var f = getIframe();
    if (!f) { return; }
    if (turningOn) {
      // Al activarlos se recarga con cc_load_policy=1 y sigue desde el mismo segundo.
      var start = Math.floor(P.cur);
      P.heard = false; P.qApplied = false; P.ccApplied = false; P.st = 1;
      f.src = embedUrl(currentId, start);
      startListening();
    } else {
      // Al desactivarlos no hace falta recargar: se descarga el módulo de subtítulos.
      enforceCC();
    }
  }

  function openPlayer(id) {
    if (currentId === id) { return; }
    currentId = id;
    P.heard = false; P.cur = 0; P.dur = 0; P.st = 1; P.lastUser = 0; P.qNow = ""; P.avail = null;
    P.qApplied = false; P.ccApplied = false; P.ccGen++;
    $("player").style.display = "block";
    $("player").scrollTop = 0;
    syncOverflow();
    $("frame").innerHTML = '<iframe src="' + embedUrl(id, 0) +
      '" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>';
    var f = getIframe();
    if (f) { f.onload = startListening; }
    sizeFrame();
    startListening();
    refreshCtl();
    updateBtns();
    $("seek").value = 0;
    $("pfall").href = "https://www.youtube.com/watch?v=" + encodeURIComponent(id);
    $("ptitle").textContent = "";
    $("pchan").textContent = "";
    $("pchan").removeAttribute("data-ch");
    $("pstats").textContent = "";
    $("pdesc").textContent = "";
    cm.id = id; cm.loaded = false; cm.token = ""; cm.loading = false; cm.gen++;
    $("cmlist").innerHTML = "";
    $("ptab-comm").textContent = t("comments");
    showTab("desc");

    call("videos", { part: "snippet,statistics", id: id }).then(function (d) {
      if (currentId !== id || !d.items.length) { return; }
      var v = d.items[0];
      $("ptitle").textContent = decode(v.snippet.title);
      $("pchan").textContent = v.snippet.channelTitle;
      if (v.snippet.channelId) { $("pchan").setAttribute("data-ch", v.snippet.channelId); }
      $("pstats").textContent = fmtNum(v.statistics.viewCount) + " " + t("views") + " \u2022 " +
        fmtAgo(v.snippet.publishedAt) +
        (v.statistics.likeCount ? " \u2022 " + fmtNum(v.statistics.likeCount) + " " + t("likes") : "");
      $("pdesc").textContent = v.snippet.description || "";
      if (v.statistics.commentCount) {
        $("ptab-comm").textContent = t("comments") + " (" + fmtNum(v.statistics.commentCount) + ")";
      }
    }).catch(function () {});
  }
  function closePlayer() {
    currentId = "";
    P.ccGen++;
    stopListening();
    closeQ();
    setFs(false);
    $("frame").innerHTML = "";
    $("player").style.display = "none";
    syncOverflow();
  }

  /* ---------- comentarios ---------- */
  function showTab(which) {
    var c = which === "comm";
    $("ptab-desc").className = "tab" + (c ? "" : " on");
    $("ptab-comm").className = "tab" + (c ? " on" : "");
    $("pdesc").style.display = c ? "none" : "block";
    $("pcomm").style.display = c ? "block" : "none";
    if (c && !cm.loaded) { cm.loaded = true; loadComments(true); }
  }
  function setOrder(o) {
    if (cm.order === o) { return; }
    cm.order = o;
    var bs = $("cmord").getElementsByTagName("button");
    for (var i = 0; i < bs.length; i++) {
      bs[i].className = "ord" + (bs[i].getAttribute("data-order") === o ? " on" : "");
    }
    loadComments(true);
  }
  function commentHtml(s, id, replies, isReply) {
    var ach = s.authorChannelId && s.authorChannelId.value;
    return '<div class="cm' + (isReply ? " rp" : "") + '">' +
      '<div class="ca"><span' + (ach ? ' class="chan" data-ch="' + esc(ach) + '"' : "") + ">" +
      esc(s.authorDisplayName) + '</span><span class="cd">' + esc(fmtAgo(s.publishedAt)) + "</span></div>" +
      '<div class="ct">' + esc(s.textDisplay) + "</div>" +
      '<div class="cl">' + (s.likeCount ? esc(fmtNum(s.likeCount) + " " + t("likes")) : "") +
      (replies ? '<button class="rbtn" type="button" data-reply="' + esc(id) + '">' +
        esc(t(replies === 1 ? "viewReply1" : "viewReplyN", { n: replies })) + "</button>" : "") + "</div>" +
      (replies ? '<div id="r-' + esc(id) + '" style="display:none"></div>' : "") + "</div>";
  }
  function loadComments(reset) {
    if (cm.loading || !cm.id) { return; }
    cm.loading = true;
    var gen = ++cm.gen, vid = cm.id;
    if (reset) { cm.token = ""; $("cmlist").innerHTML = spinHtml(); }
    else {
      removeEl("cmmore");
      $("cmlist").insertAdjacentHTML("beforeend", spinHtml("cmspin"));
    }
    call("commentThreads", { part: "snippet", videoId: vid, order: cm.order, maxResults: 20,
                             textFormat: "plainText", pageToken: cm.token }).then(function (d) {
      if (gen !== cm.gen) { return; }
      cm.loading = false;
      removeEl("cmmore"); removeEl("cmspin");
      if (reset) { $("cmlist").innerHTML = ""; }
      if (!d.items.length && reset) {
        $("cmlist").innerHTML = '<div class="msg">' + esc(t("noComments")) + "</div>"; return;
      }
      var h = "";
      for (var i = 0; i < d.items.length; i++) {
        var th = d.items[i], top = th.snippet.topLevelComment;
        h += commentHtml(top.snippet, top.id, th.snippet.totalReplyCount || 0, false);
      }
      $("cmlist").insertAdjacentHTML("beforeend", h);
      cm.token = d.nextPageToken || "";
      if (cm.token) {
        $("cmlist").insertAdjacentHTML("beforeend",
          '<button class="more" id="cmmore" type="button" style="width:100%;margin:10px 0">' +
          esc(t("moreCom")) + "</button>");
      }
    }).catch(function (e) {
      if (gen !== cm.gen) { return; }
      cm.loading = false;
      removeEl("cmmore"); removeEl("cmspin");
      var html = '<div class="msg err">' + esc(e.message) + "</div>";
      if (reset) { $("cmlist").innerHTML = html; } else { $("cmlist").insertAdjacentHTML("beforeend", html); }
    });
  }
  function toggleReplies(parentId, btn) {
    var box = $("r-" + parentId);
    if (!box) { return; }
    if (box.getAttribute("data-loaded") === "1") {
      var hidden = box.style.display === "none";
      box.style.display = hidden ? "block" : "none";
      btn.textContent = hidden ? t("hideReplies") : t("showReplies");
      return;
    }
    if (box.getAttribute("data-busy") === "1") { return; }
    box.setAttribute("data-busy", "1");
    box.style.display = "block";
    box.innerHTML = spinHtml();
    call("comments", { part: "snippet", parentId: parentId, maxResults: 50, textFormat: "plainText" })
      .then(function (d) {
        var h = "";
        for (var i = 0; i < d.items.length; i++) { h += commentHtml(d.items[i].snippet, d.items[i].id, 0, true); }
        box.innerHTML = h || '<div class="msg">' + esc(t("replyFail")) + "</div>";
        box.setAttribute("data-loaded", "1");
        box.removeAttribute("data-busy");
        btn.textContent = t("hideReplies");
      }).catch(function (e) {
        box.innerHTML = '<div class="msg err">' + esc(e.message) + "</div>";
        box.removeAttribute("data-busy");
      });
  }

  /* ---------- navegación por hash (el botón "atrás" del teléfono funciona) ---------- */
  function route() {
    var h = location.hash;
    var mv = /^#v=([\w-]{6,20})(,fs)?$/.exec(h);
    var mc = /^#c=([\w-]{10,40})$/.exec(h);
    if (mv) {
      openPlayer(mv[1]);
      setFs(!!mv[2]);
    } else {
      closePlayer();
      if (mc) { openChannel(mc[1]); } else { closeChannel(); }
    }
  }

  /* ---------- ajustes ---------- */
  function openCfg() {
    $("key").value = getKey();
    $("reg").value = getRegion();
    $("lang").value = lang;
    $("cfg").style.display = "block";
  }
  function closeCfg() { $("cfg").style.display = "none"; }

  /* ---------- eventos ---------- */
  function doSearch() {
    var q = $("q").value.replace(/^\s+|\s+$/g, "");
    if (!q) { return; }
    $("q").blur();
    state.query = q;
    setTab("search");
    if (location.hash) { location.hash = ""; }
    load(true);
  }
  function goBack() {
    if (location.hash) { history.back(); } else { closePlayer(); closeChannel(); }
  }

  $("go").onclick = doSearch;
  $("q").onkeydown = function (e) {
    if (e.keyCode === 13 || e.key === "Enter") { e.preventDefault(); doSearch(); }
  };
  $("tab-trend").onclick = function () { setTab("trend"); load(true); };
  $("tab-search").onclick = function () {
    if (state.query) { setTab("search"); load(true); } else { $("q").focus(); }
  };
  $("gear").onclick = openCfg;
  $("close").onclick = closeCfg;
  $("save").onclick = function () {
    var k = $("key").value.replace(/\s+/g, "");
    var r = $("reg").value.replace(/\s+/g, "").toUpperCase() || "AR";
    var l = $("lang").value;
    store.set("yt_key", k);
    store.set("yt_region", r);
    if (LANGS[l]) { lang = l; store.set("yt_lang", l); }
    applyLang();
    applyTheme();
    updateBtns();
    refreshCtl();
    closeCfg();
    if (k) { load(true); }
  };
  $("back").onclick = goBack;
  $("cback").onclick = goBack;
  $("pp").onclick = function () {
    cmd(P.st === 1 ? "pauseVideo" : "playVideo");
    P.st = P.st === 1 ? 2 : 1;
    refreshCtl();
  };
  $("fsbtn").onclick = toggleFs;
  $("ccbtn").onclick = toggleCC;
  $("qbtn").onclick = openQ;
  $("ptab-desc").onclick = function () { showTab("desc"); };
  $("ptab-comm").onclick = function () { showTab("comm"); };
  $("seek").oninput = function () {
    P.lastUser = Date.now();
    $("tcur").textContent = fmtClock(+this.value);
  };
  $("seek").onchange = function () { seekTo(+this.value); };

  document.addEventListener("click", function (e) {
    var el = e.target, a;
    if (el && el.id === "qmenu") { closeQ(); return; }
    while (el && el !== document) {
      if (el.id === "morebtn") { load(false); return; }
      if (el.id === "cmorebtn") { loadChan(false); return; }
      if (el.id === "cmmore") { loadComments(false); return; }
      if (el.getAttribute) {
        if ((a = el.getAttribute("data-accent"))) { store.set("yt_accent", a); applyTheme(); return; }
        if ((a = el.getAttribute("data-bg"))) { store.set("yt_bg", a); applyTheme(); return; }
        if ((a = el.getAttribute("data-q"))) { setQuality(a); return; }
        if ((a = el.getAttribute("data-seek")) !== null) { seekBy(+a); return; }
        if ((a = el.getAttribute("data-reply"))) { toggleReplies(a, el); return; }
        if ((a = el.getAttribute("data-order"))) { setOrder(a); return; }
        if ((a = el.getAttribute("data-ch"))) { location.hash = "c=" + a; return; }
        if ((a = el.getAttribute("data-id"))) { location.hash = "v=" + a; return; }
      }
      el = el.parentNode;
    }
  }, false);
  window.addEventListener("hashchange", route, false);
  window.addEventListener("resize", sizeFrame, false);
  window.addEventListener("orientationchange", function () { setTimeout(sizeFrame, 300); }, false);

  /* ---------- inicio ---------- */
  applyLang();
  applyTheme();
  updateBtns();
  refreshCtl();
  if (!getKey()) {
    showMsg(t("start"));
    openCfg();
  } else {
    load(true);
  }
  route();
})();
</script>
</body>
</html>
